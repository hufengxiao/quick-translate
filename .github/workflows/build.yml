name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install loguru pyinstaller

      - name: Verify imports
        run: python -c "import sys; sys.path.insert(0, '.'); from dictionary import Dictionary; print('OK')"

      - name: Run tests
        run: python ci_test.py

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install loguru pyinstaller

      - name: Build EXE
        run: pyinstaller quicktranslate.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate
          path: dist/QuickTranslate.exe

  release:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install loguru pyinstaller

      - name: Build EXE
        run: pyinstaller quicktranslate.spec --noconfirm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickTranslate.exe
          generate_release_notes: true
